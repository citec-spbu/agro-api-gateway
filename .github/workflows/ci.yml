name: CI

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Nginx config syntax in container
        run: |
          docker run --rm \
            --add-host auth-service:127.0.0.1 \
            --add-host profiles-service:127.0.0.1 \
            --add-host fields-service:127.0.0.1 \
            --add-host meteo-service:127.0.0.1 \
            --add-host dzz-service:127.0.0.1 \
            --add-host analytics-service:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/includes:/etc/nginx/includes:ro" \
            nginx:1.27-alpine nginx -t

  tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke checks
        run: bash tests/nginx_config_smoke.sh

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ false }}

    steps:
      - name: Deploy placeholder
        run: echo "Deploy disabled. SSH access is not configured yet."
